
name: Rolloutary CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Run unit tests
        run: npm test

  build-and-publish:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Deploy to Kubernetes staging
    needs: build-and-publish
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        shell: powershell
        run: |
          kubectl cluster-info
          kubectl get namespace staging

      - name: Deploy published image
        shell: powershell
        run: |
          $image = "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          kubectl set image deployment/myapp myapp=$image -n staging
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update the staging deployment"
          }

      - name: Verify rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/myapp -n staging --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            throw "Staging rollout failed"
          }
          kubectl get pods -n staging -l app=myapp
